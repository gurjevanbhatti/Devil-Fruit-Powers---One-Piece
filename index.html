<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gum Gum Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
  </div>

  <div id="start">
    <div class="showcase">
      <h1 class="sign">
        <!-- title sign in the style of the One Piece logo, as pixel art -->
        <img src="images/sign.png" alt="Gum Gum Cam" />
      </h1>

      <!-- the fruit in its treasure chest, on a table. pixel art, one unit = one pixel -->
      <svg class="chest" viewBox="0 -8 96 80" shape-rendering="crispEdges" aria-hidden="true">

        <g class="box">
          <!-- table -->
          <rect x="0" y="60" width="96" height="12" fill="#8b5a2b" />
          <rect x="0" y="60" width="96" height="2" fill="#b07a3e" />
          <rect x="0" y="66" width="96" height="1" fill="#6b4226" />
          <rect x="10" y="60" width="78" height="2" fill="#5a3418" />

          <!-- open lid, leaning back -->
          <rect x="21" y="2" width="54" height="2" fill="#2a160a" />
          <rect x="15" y="4" width="66" height="2" fill="#2a160a" />
          <rect x="13" y="6" width="70" height="22" fill="#2a160a" />
          <rect x="22" y="3" width="52" height="1" fill="#f4c430" />
          <rect x="16" y="5" width="64" height="1" fill="#f4c430" />
          <rect x="14" y="6" width="68" height="21" fill="#f4c430" />
          <rect x="17" y="8" width="62" height="19" fill="#4a2a14" />
          <rect x="17" y="8" width="62" height="2" fill="#2f1a0c" />

          <!-- red velvet cushion -->
          <rect x="18" y="23" width="60" height="1" fill="#7e1a20" />
          <rect x="15" y="24" width="66" height="9" fill="#7e1a20" />
          <rect x="19" y="24" width="58" height="1" fill="#b8282f" />
          <rect x="16" y="25" width="64" height="8" fill="#b8282f" />
          <rect x="22" y="26" width="18" height="2" fill="#e0525a" />
          <rect x="58" y="26" width="12" height="1" fill="#e0525a" />
          <rect x="16" y="31" width="2" height="4" fill="#f4c430" />
          <rect x="78" y="31" width="2" height="4" fill="#f4c430" />

          <!-- chest body -->
          <rect x="11" y="32" width="74" height="29" fill="#2a160a" />
          <rect x="12" y="33" width="72" height="27" fill="#8b5a2b" />
          <rect x="12" y="41" width="72" height="1" fill="#6b4226" />
          <rect x="12" y="49" width="72" height="1" fill="#6b4226" />
          <rect x="12" y="57" width="72" height="3" fill="#6b4226" />
          <rect x="12" y="33" width="72" height="3" fill="#f4c430" />
          <rect x="12" y="35" width="72" height="1" fill="#c99a1c" />
          <rect x="12" y="33" width="5" height="27" fill="#f4c430" />
          <rect x="16" y="33" width="1" height="27" fill="#c99a1c" />
          <rect x="79" y="33" width="5" height="27" fill="#f4c430" />
          <rect x="83" y="33" width="1" height="27" fill="#c99a1c" />
          <!-- lock -->
          <rect x="42" y="37" width="12" height="12" fill="#2a160a" />
          <rect x="43" y="38" width="10" height="10" fill="#f4c430" />
          <rect x="43" y="47" width="10" height="1" fill="#c99a1c" />
          <rect x="47" y="41" width="2" height="4" fill="#2a160a" />
        </g>

        <!-- the fruit on the cushion -->
        <g class="fruit">
          <image href="images/fruit.png" x="33" y="-6" width="30" height="32" style="image-rendering: pixelated" />
        </g>

        <!-- sparkles -->
        <g class="sparkles" fill="#e0a800">
          <path class="spark" d="M26 -2h1v1h1v1h-1v1h-1v-1h-1v-1h1z" />
          <path class="spark" d="M70 4h1v1h1v1h-1v1h-1v-1h-1v-1h1z" />
          <path class="spark" d="M30 16h1v1h1v1h-1v1h-1v-1h-1v-1h1z" />
        </g>
      </svg>

      <p class="tagline">turn on your camera to get devil fruit powers like Luffy!</p>
      <button id="go">turn on camera</button>
      <a class="secondary" href="instructions.html">how to play</a>
      <small id="status"></small>
    </div>
  </div>

  <video id="cam" playsinline muted></video>
  <script type="module" src="main.js"></script>
</body>
</html>
